<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liquor Bot – Test Chat</title>
<style>
  :root { --bg:#efeae2; --me:#d9fdd3; --bot:#fff; --bar:#075e54; --text:#111b21; --muted:#667781; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--text); height:100dvh; display:flex; flex-direction:column; }
  header { background:var(--bar); color:#fff; padding:10px 16px; display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; }
  header h1 { font-size:16px; margin:0; flex:1 1 100%; }
  header label { font-size:13px; display:flex; gap:6px; align-items:center; }
  header select, header button { font:inherit; font-size:13px; padding:4px 8px; border-radius:6px; border:0; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:min(80%, 560px); padding:8px 12px; border-radius:8px; white-space:pre-wrap; box-shadow:0 1px 1px #0001; }
  .me { align-self:flex-end; background:var(--me); }
  .bot { align-self:flex-start; background:var(--bot); }
  .typing { color:var(--muted); font-style:italic; }
  form { display:flex; gap:8px; padding:10px 16px; background:#f0f2f5; }
  input { flex:1; font:inherit; padding:10px 14px; border-radius:20px; border:1px solid #ccc; min-width:0; }
  form button { font:inherit; padding:0 18px; border-radius:20px; border:0; background:var(--bar); color:#fff; }
  #mic { padding:0 14px; font-size:18px; }
  #mic.rec { background:#d93025; animation:pulse 1s infinite; }
  @keyframes pulse { 50% { opacity:.6; } }
  #samples { display:flex; gap:6px; flex-wrap:wrap; padding:0 16px 8px; background:#f0f2f5; }
  #samples button { font-size:12px; border:1px solid #ccc; background:#fff; border-radius:12px; padding:3px 10px; cursor:pointer; }
</style>
</head>
<body>
<header>
  <h1>🍾 Liquor Bot – customer test chat</h1>
  <label>Store <select id="store"></select></label>
  <label>Prices <select id="mode"><option value="full">full</option><option value="totals_only">totals only</option><option value="none">none</option></select></label>
  <button id="reset" type="button">New customer</button>
</header>
<div id="log" aria-live="polite"></div>
<div id="samples"></div>
<form id="f"><input id="t" autocomplete="off" placeholder="Type like a customer… e.g. OM half hai?" aria-label="Message"><button>Send</button><button id="mic" type="button" aria-label="Record voice note">🎤</button></form>
<script>
const $ = (id) => document.getElementById(id);
const samples = ["haan", "OM half hai?", "2 full BP aur 4 KF strong", "Black Dog hai kya", "hold kar do", "6 log, 5000 budget, whisky aur beer", "Jameson kaisi hoti hai?", "ghar pe delivery milegi?"];
let phone = newPhone();
function newPhone() { return "test-" + Math.random().toString(36).slice(2, 8); }
function add(text, who) { const d = document.createElement("div"); d.className = "msg " + who; d.textContent = text; $("log").append(d); d.scrollIntoView(); return d; }

async function loadStores() {
  const stores = await fetch("/api/stores").then((r) => r.json());
  $("store").innerHTML = stores.map((s) => `<option value="${s.id}" data-mode="${s.priceMode}">${s.name}</option>`).join("");
  syncMode();
}
function syncMode() { $("mode").value = $("store").selectedOptions[0]?.dataset.mode ?? "full"; }
function reset() { phone = newPhone(); $("log").innerHTML = ""; add(`New customer (${phone}). Say hi!`, "bot typing"); }

async function send(text) {
  add(text, "me");
  const wait = add("typing…", "bot typing");
  try {
    const r = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ storeId: $("store").value, phone, text }) });
    const j = await r.json();
    wait.className = "msg bot"; wait.textContent = j.reply ?? j.error;
  } catch { wait.textContent = "Server not reachable"; }
}

$("f").onsubmit = (e) => { e.preventDefault(); const t = $("t").value.trim(); if (t) { $("t").value = ""; send(t); } };
$("store").onchange = () => { syncMode(); reset(); };
$("mode").onchange = async () => {
  await fetch(`/api/stores/${$("store").value}`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ priceMode: $("mode").value }) });
  $("store").selectedOptions[0].dataset.mode = $("mode").value;
  add(`(Store priceMode switched to "${$("mode").value}")`, "bot typing");
};
$("reset").onclick = reset;

// Voice note: tap to record, tap again to send (auto-stops at 30s, Sarvam's limit).
let rec = null;
$("mic").onclick = async () => {
  if (rec) return rec.stop();
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch { return add("Mic permission nahi mili. Browser me mic allow karein.", "bot typing"); }
  const chunks = [];
  rec = new MediaRecorder(stream);
  rec.ondataavailable = (e) => chunks.push(e.data);
  const timer = setTimeout(() => rec?.stop(), 30_000);
  rec.onstop = async () => {
    clearTimeout(timer);
    stream.getTracks().forEach((t) => t.stop());
    const type = rec.mimeType || "audio/webm";
    rec = null;
    $("mic").classList.remove("rec"); $("mic").setAttribute("aria-label", "Record voice note");
    const me = add("🎤 voice note…", "me");
    const wait = add("sun raha hoon…", "bot typing");
    try {
      const r = await fetch(`/api/voice?storeId=${encodeURIComponent($("store").value)}&phone=${encodeURIComponent(phone)}`, { method: "POST", headers: { "Content-Type": type }, body: new Blob(chunks, { type }) });
      const j = await r.json();
      if (j.transcript) me.textContent = "🎤 " + j.transcript;
      wait.className = "msg bot"; wait.textContent = j.reply ?? j.error;
    } catch { wait.textContent = "Server not reachable"; }
  };
  rec.start();
  $("mic").classList.add("rec"); $("mic").setAttribute("aria-label", "Stop and send voice note");
};
samples.forEach((s) => { const b = document.createElement("button"); b.type = "button"; b.textContent = s; b.onclick = () => send(s); $("samples").append(b); });
loadStores().then(reset);
</script>
</body>
</html>
